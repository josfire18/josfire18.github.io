<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lab · Joey Rockwood</title>
<meta name="description" content="Small free tools and toys by Joey Rockwood.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: one narrow column; a short intro, the project list, a quiet footer. */
:root {
  --bg: #eceef2; --surface: #ffffff; --ink: #15181f; --muted: #646b78; --line: #d4d8df; --accent: #0d7a6f;
  --font-body: "Figtree", -apple-system, "Segoe UI", Roboto, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1216; --surface: #1a1e25; --ink: #e9ecf1; --muted: #98a0ad; --line: #2b313b; --accent: #35c2b0; color-scheme: dark; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
main { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: calc(48px + env(safe-area-inset-top, 0px)) calc(40px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 32px; }
h1 { margin: 0; font-size: 34px; letter-spacing: -0.02em; line-height: 1.1; }
.intro p { margin: 8px 0 0; color: var(--muted); max-width: 46ch; }
.projects { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.projects a { display: grid; gap: 2px; padding: 16px 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; color: inherit; text-decoration: none; }
.projects a:hover, .projects a:focus-visible { border-color: var(--accent); outline: none; }
.projects b { font-size: 18px; font-weight: 650; }
.projects span { color: var(--muted); font-size: 15px; }
.projects .path { font-family: var(--font-mono); font-size: 12px; color: var(--accent); }
.tip { display: inline-flex; align-items: center; gap: 8px; justify-self: start; padding: 10px 16px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 600; }
.tip:hover { border-color: var(--accent); }
footer { color: var(--muted); font-size: 14px; }
footer a { color: inherit; }
</style>
</head>
<body>
<main>
  <section class="intro">
    <h1>Lab</h1>
    <p>Small tools and toys I build for fun. Free to use, no accounts, nothing tracked.</p>
  </section>

  <!-- Add a project: one <li> per repo; its site lives at /<repo-name>/ -->
  <ul class="projects">
    <li><a href="/cube-solver/">
      <span class="path">/cube-solver</span>
      <b>Cube Solver</b>
      <span>Scan or tap in your Rubik's Cube, then follow the solution one turn at a time. Also a practice mode.</span>
    </a></li>
  </ul>

  <a class="tip" id="tip" href="https://ko-fi.com/joeyrockwood" target="_blank" rel="noopener">♥ Buy me a coffee</a>

  <footer>Made by <a href="https://joeyrockwood.fyi">Joey Rockwood</a>.</footer>
</main>
</body>
</html>
